[package]
name = "mhr-gpui-wgpu"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The wgpu renderer and cosmic-text text system of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "wgpu", "renderer", "text"]
categories = ["rendering", "gui"]

[package.metadata.gpui-pre]
zed-crate = "gpui_wgpu"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/gpui_wgpu.rs"
doctest = false
name = "gpui_wgpu"

[features]
default = []
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
collections = { workspace = true }
cosmic-text = "0.19.0"
etagere = { workspace = true }
itertools = { workspace = true }
image = { workspace = true, optional = true }
log = { workspace = true }
parking_lot = { workspace = true }
profiling = { workspace = true }
raw-window-handle = { workspace = true }
smallvec = { workspace = true }
swash = { workspace = true }
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
gpui_util = { workspace = true }
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, features = ["webgl"] }

[lints]
workspace = true

[[bench]]
name = "layout_line"
harness = false

[dev-dependencies]
criterion = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
image = { workspace = true }
naga = { version = "30.0.1", features = ["wgsl-in"] }
