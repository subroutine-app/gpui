[package]
name = "mhr-scheduler"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The task scheduler and executors of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "executor", "async", "scheduler"]
categories = ["asynchronous", "concurrency"]

[package.metadata.gpui-pre]
zed-crate = "scheduler"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/scheduler.rs"
doctest = false
name = "scheduler"

[features]
test-support = []
wasm-threads = ["dep:wasm_thread", "flume/spin"]

[dependencies]
async-task = { workspace = true }
backtrace = { workspace = true }
chrono = { workspace = true, features = ["now", "wasmbind"] }
flume = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = { workspace = true, optional = true }

[lints]
workspace = true
