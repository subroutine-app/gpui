[package]
name = "mhr-bench-metrics"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Criterion measurements beyond wall time, such as hardware counters and heap allocations, from mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["criterion", "benchmark", "perf-counters"]
categories = ["development-tools::profiling"]

[package.metadata.gpui-pre]
zed-crate = "bench_metrics"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/bench_metrics.rs"
doctest = false
name = "bench_metrics"

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
criterion = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = { workspace = true }

[lints]
workspace = true
