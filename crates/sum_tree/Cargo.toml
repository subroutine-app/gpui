[package]
name = "gpui-pre-sum-tree"
version = "0.3.11"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree (gpui-pre snapshot of zed@f816e1f)"
repository = "https://github.com/zed-industries/zed"

[package.metadata.cargo-shear]
ignored = ["tracing"]

[package.metadata.gpui-pre]
zed-crate = "sum_tree"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/sum_tree.rs"
doctest = false
name = "sum_tree"

[features]
test-support = ["proptest"]

[dependencies]
heapless = { workspace = true }
rayon = { workspace = true }
ztracing = { workspace = true }
tracing = { workspace = true }
proptest = { workspace = true, optional = true }

[lints]
workspace = true
