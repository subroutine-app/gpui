[package]
name = "mhr-gpui-apple"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Metal rendering and task dispatch shared by the Apple platforms of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "metal", "macos", "ios"]
categories = ["rendering::graphics-api", "os::macos-apis"]

[package.metadata.gpui-pre]
zed-crate = "gpui_apple"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/gpui_apple.rs"
doctest = false
name = "gpui_apple"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = [
    "dep:font-kit",
    "dep:core-text",
    "dep:objc2-core-text",
    "dep:pathfinder_geometry",
]

[dependencies]
gpui = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow = { workspace = true }
async-task = { workspace = true }
block2 = { workspace = true }
collections = { workspace = true }
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }
core-graphics = { workspace = true }
core-text = { workspace = true, optional = true }
dispatch2 = { workspace = true, features = ["block2"] }
etagere = { workspace = true }
futures = { workspace = true }
font-kit = { workspace = true, optional = true, features = ["source"] }
gpui_util = { workspace = true }
image = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
mach2 = { workspace = true }
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-core-text = { workspace = true, optional = true }
objc2-core-video = { workspace = true, features = [
    "CVPixelBuffer",
    "CVMetalTexture",
    "CVMetalTextureCache",
    "CVReturn",
    "objc2",
    "objc2-metal",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-foundation = { workspace = true, features = ["NSThread", "NSNotification", "NSOperation", "NSProcessInfo", "block2"] }
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2-security = { workspace = true }
parking_lot = { workspace = true }
pathfinder_geometry = { workspace = true, optional = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true

# The tests use `cfg(test)` code that needs these features.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
objc2-core-video = { workspace = true, features = ["CVBase"] }
