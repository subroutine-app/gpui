[package]
name = "mhr-gpui-macros"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Procedural macros of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "macros", "derive"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[package.metadata.gpui-pre]
zed-crate = "gpui_macros"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
name = "gpui_macros"

[features]
inspector = []

[dependencies]
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }
proc-macro-crate = "3"

[lints]
workspace = true

# Without a version, the published crate leaves this out, so it needs no release of mhr-gpui.
[dev-dependencies]
gpui = { path = "../gpui", package = "mhr-gpui", default-features = false, features = ["inspector", "test-support"] }
