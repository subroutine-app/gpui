[package]
name = "mhr-http-client"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The HTTP client interface of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "http", "client"]
categories = ["web-programming::http-client"]

[package.metadata.gpui-pre]
zed-crate = "http_client"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/http_client.rs"
test = false
doctest = false
name = "http_client"

[features]
test-support = ["dep:log"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true }
http = { workspace = true }
log = { workspace = true, optional = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
