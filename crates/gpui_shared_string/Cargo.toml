[package]
name = "mhr-gpui-shared-string"
version = "0.2.0"
publish = true
edition = { workspace = true }
license = "Apache-2.0"
description = "SharedString, the cheaply cloned string type of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "string", "shared"]
categories = ["data-structures"]

[package.metadata.gpui-pre]
zed-crate = "gpui_shared_string"
