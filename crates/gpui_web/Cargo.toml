[package]
name = "mhr-gpui-web"
version = "0.2.0"
publish = true
edition = { workspace = true }
license = "Apache-2.0"
description = "The web platform of mhr-gpui, a fork of Zed's gpui, for WebAssembly in the browser"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gui", "gpui", "wasm", "web"]
categories = ["gui", "wasm"]
autoexamples = false

[package.metadata.cargo-shear]
ignored = ["scheduler"]

[package.metadata.gpui-pre]
zed-crate = "gpui_web"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/gpui_web.rs"
doctest = false
name = "gpui_web"

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[dependencies]
unicode-properties = "0.1.3"
unicode-script = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { workspace = true }
scheduler = { workspace = true }
parking_lot = { workspace = true, features = ["nightly"] }
gpui_wgpu = { workspace = true }
http_client = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
raw-window-handle = { workspace = true }
smallvec = { workspace = true }
wasm_thread = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "TextMetrics",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }

[lints]
workspace = true

[dev-dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
smallvec = { workspace = true }
