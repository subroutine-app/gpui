[package]
name = "mhr-zlog"
version = "0.2.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The logger of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "logging", "log"]
categories = ["development-tools::debugging"]

[package.metadata.gpui-pre]
zed-crate = "zlog"
zed-version = "0.1.0"
zed-rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

[lib]
path = "src/zlog.rs"
doctest = false
name = "zlog"

[features]
default = []

[dependencies]
collections = { workspace = true }
chrono = { workspace = true, default-features = true }
log = { workspace = true, features = ["kv_unstable_std"] }
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
